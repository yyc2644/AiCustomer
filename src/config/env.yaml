# 环境配置文件
# 用于区分不同测试环境：dev(开发)、test(测试)、prod(生产)

# 默认环境
default: test

# 各环境配置
environments:
  # 开发环境配置
  dev:
    name: "开发环境"
    api:
      base_url: "http://localhost:8000"
      timeout: 30
    database:
      host: "localhost"
      port: 3306
      name: "customer_service_dev"
      user: "dev_user"
      password: "${DB_PASSWORD}"  # 从环境变量读取
    websocket:
      url: "ws://localhost:8000/ws"
    admin:
      username: "admin"
      password: "${ADMIN_PASSWORD}"
  
  # 测试环境配置
  test:
    name: "测试环境"
    api:
      base_url: "https://test-api.zhizhi168.com/#/home"
      timeout: 60
    database:
      host: "test-db.example.com"
      port: 3306
      name: "customer_service_test"
      user: "test_user"
      password: "${TEST_DB_PASSWORD}"
    websocket:
      url: "wss://test-api.example.com/ws"
    admin:
      username: "test_admin"
      password: "${TEST_ADMIN_PASSWORD}"
  
  # 生产环境配置（仅用于灰度验证，不建议直接测试）
  prod:
    name: "生产环境"
    api:
      base_url: "https://api.example.com"
      timeout: 60
    database:
      host: "prod-db.example.com"
      port: 3306
      name: "customer_service_prod"
      user: "prod_user"
      password: "${PROD_DB_PASSWORD}"
    websocket:
      url: "wss://api.example.com/ws"
    admin:
      username: "prod_admin"
      password: "${PROD_ADMIN_PASSWORD}"

# 测试数据路径配置
test_data:
  corpus_dir: "data/corpus"
  behavior_cases_dir: "data/behavior_cases"
  ui_locators_dir: "data/ui_locators"
  reports_dir: "reports"

# 并发测试配置
concurrency:
  max_workers: 10
  batch_size: 50

# 调试开关
debug:
  enable_screenshots: true
  enable_request_log: true
  enable_response_log: true
