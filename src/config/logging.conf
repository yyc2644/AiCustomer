; 日志配置文件
; 格式：Python logging.config.fileConfig

[loggers]
keys=root,test,api,ui,dialogue,nlu

[handlers]
keys=consoleHandler,fileHandler,errorHandler

[formatters]
keys=standard,detailed

; ============================================
; Logger 配置
; ============================================

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_test]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=test
propagate=0

[logger_api]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=test.api
propagate=0

[logger_ui]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=test.ui
propagate=0

[logger_dialogue]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=test.dialogue
propagate=0

[logger_nlu]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=test.nlu
propagate=0

; ============================================
; Handler 配置
; ============================================

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailed
args=('reports/logs/test.log', 'a', 10485760, 5, 'utf-8')

[handler_errorHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailed
args=('reports/logs/error.log', 'a', 10485760, 5, 'utf-8')

; ============================================
; Formatter 配置
; ============================================

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailed]
format=%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(funcName)s() - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
