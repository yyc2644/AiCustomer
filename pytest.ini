# Pytest配置文件

[pytest]
# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 标记定义
markers =
    api: 后台API接口测试
    ui: 页面UI测试
    dialogue: 行为树对话测试
    nlu: 语料和知识库测试
    slow: 慢速测试
    smoke: 冒烟测试
    regression: 回归测试

# 命令行选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率
[coverage:run]
source = .
omit =
    tests/*
    */test_*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
